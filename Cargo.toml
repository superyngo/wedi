[workspace]
resolver = "2"
members = ["crates/wedi-core", "crates/wedi-widget", "."]

[workspace.package]
version = "0.10.0"
edition = "2021"
authors = ["wen"]
license = "MIT"

[package]
name = "wedi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A cross-platform minimalist lightweight CLI text editor"

[dependencies]
wedi-core = { path = "crates/wedi-core", version = "0.10.0", default-features = false }
wedi-widget = { path = "crates/wedi-widget", version = "0.10.0", default-features = false, features = ["crossterm"] }
crossterm = "0.27"
pico-args = "0.5"      # CLI 參數解析
anyhow = "1.0"          # 錯誤處理
encoding_rs = "0.8"     # 編碼處理

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "winbase", "memoryapi", "winnls", "consoleapi", "handleapi", "processenv", "wincon"] }

[dev-dependencies]
assert_cmd = "2.0"      # CLI 測試
predicates = "3.0"      # 測試斷言
tempfile = "3.8"        # 臨時文件測試

[features]
default = ["syntax-highlighting", "mouse-support"]
mouse-support = ["wedi-core/mouse-support"]
syntax-highlighting = ["wedi-core/syntax-highlighting", "wedi-widget/syntax-highlighting"]

[profile.release]
strip = true            # 移除符號以減小二進制文件大小
lto = true              # 啟用鏈接時優化
opt-level = "z"         # 優化文件大小
codegen-units = 1       # 單編譯單元
panic = "abort"         # 減少 panic 處理代碼
incremental = false     # 避免未使用的編譯 cache
